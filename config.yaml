# All experiment settings live here (course rule: externalised configuration).
# Change values here, not inside the code.

data:
  path: data/weatherHistory.csv
  sha256: 22c028ceb97c6ad405831dfda61f0235532d9ab873229ff57ce4240853ef0a1f
  source: https://www.kaggle.com/datasets/arnab132/weather-dataset (version 1, downloaded 2026-10-22)
  timezone: Europe/Budapest
  window_days: 3            # model sees the last 3 days and predicts the next day's mean, min and max
  # Chronological split by the date being predicted (no shuffling across time).
  train_end: "2013-12-31"   # train: 2006-2013
  val_end: "2015-12-31"     # validation: 2014-2015, test: 2016
  # Real data ends here: 4 Nov - 31 Dec 2016 are artificial copies of the previous day (Issue 9),
  # so no sample may predict a day after this date.
  valid_until: "2016-11-03"

seeds: [123, 2137, 15190]   # every configuration is trained with these 3 seeds

# The Class 2 tabular baseline exactly as taught: Dense(64) -> Dense(32) -> Dense(1), Adam, MSE, batch 32.
# All parameter names are explained here; the candidates below change only some of them.
baseline:
  input: daily              # daily | hourly | both
  daily_arch: flatten       # how the 3 daily rows are read: flatten | lstm | gru
  hourly_arch: gru          # how the 72 hourly rows are read: lstm | gru | conv1d
  units: 32                 # units of the recurrent / conv layer
  bidirectional: false
  dense: [64, 32]           # dense layers after the input branches
  dropout: 0.0
  rnn_dropout: 0.0
  l2: 0.0
  target: absolute          # absolute | delta (= tomorrow's value minus today's value)
  text: false               # add the 3 'Daily Summary' sentences as multi-hot words (Class 2 NLP)
  calendar: true            # day-of-year (sin, cos) of the predicted day
  loss: mse                 # mse | huber
  lr: 0.001
  batch_size: 32
  epochs: 300
  patience: 15              # early stopping on validation loss
  reduce_lr: false

# ---------------------------------------------------------------------------------------------
# Targets: the next day's daily mean, minimum and maximum temperature (local calendar day).
targets: [mean, min, max]

# Settings shared by all candidate networks (§7). Chosen up front, with the reasons in the notebook:
#  - delta target: tomorrow is very close to today (autocorrelation 0.97), so the network learns the change
#  - dropout 0.4, Dense(32) head, lr 0.0003: small dataset (~2,900 training days) -> overfitting risk;
#    values from the preliminary experiments in the appendix
common:
  units: 32
  bidirectional: false
  dense: [32]
  dropout: 0.4
  rnn_dropout: 0.0
  l2: 0.0
  target: delta
  text: false
  calendar: true
  loss: mse
  lr: 0.0003
  batch_size: 32
  epochs: 300
  patience: 15
  reduce_lr: false
  daily_arch: gru
  hourly_arch: gru

# Candidate networks (§7). Each is evaluated with blocked K-fold (5 folds x 3 seeds) on every target.
candidates:
  - name: "Dense (Class 2 baseline)"
    why: "the course's starting point for tabular data, exactly as taught"
    params: baseline          # the 'baseline' block above, unchanged
    outputs: [single]
  - name: "Dense (shared settings)"
    why: "same architecture with the shared settings - separates the effect of settings from architecture"
    params: {input: daily, daily_arch: flatten}
  - name: "Daily GRU"
    why: "reads the 3 days in order (Class 2, language.ipynb), instead of a flat list of numbers"
    params: {input: daily}
  - name: "Hourly GRU"
    why: "the daily cycle and the latest hours are hidden in daily averages (§3); read all 72 hours"
    params: {input: hourly}
  - name: "Two-branch GRU"
    why: "hourly detail + compact daily summaries (min/max, pressure change, trends) together"
    params: {input: both}
  - name: "Two-branch GRU + attention"
    why: "a learned weight per hour, so the model can focus on the most informative hours"
    params: {input: both, attention: true}

# Output designs tried for every candidate (except where 'outputs' is given):
#  single   - one model per target (3 separate models)
#  joint    - one model with 3 outputs (mean, min, max); the targets share what the network learns
#  hourly24 - one model predicting the next day's 24 hourly temperatures; mean/min/max are derived
outputs: [single, joint, hourly24]

# Blocked K-fold over years (regression.ipynb uses K-fold for small data; whole years avoid leakage).
cv:
  folds: [[2006, 2007], [2008, 2009], [2010, 2011], [2012, 2013], [2014, 2015]]

# Classic machine-learning benchmarks on the same inputs, targets and folds.
classic:
  hgb: {max_iter: 1000, learning_rate: 0.05, max_leaf_nodes: 31, l2_regularization: 1.0}
  ridge_alphas: [10.0, 100.0, 1000.0, 3000.0, 10000.0]

# Why each part of the chosen models is there (§8): remove / replace one component at a time.
justification:
  - {name: "without the hourly branch", change: {input: daily}}
  - {name: "without the daily branch", change: {input: hourly}}
  - {name: "without attention", change: {attention: false}}
  - {name: "predict the value instead of the change", change: {target: absolute}}
  - {name: "daily rows flattened instead of GRU", change: {daily_arch: flatten}}
  - {name: "without dropout", change: {dropout: 0.0}}
  - {name: "without the calendar input", change: {calendar: false}}

# Which inputs matter (§8): drop one feature group at a time from the chosen models.
feature_ablation: [temperature, moisture, visibility, pressure, wind, sky]

# Final evaluation on the test period (1 Jan - 3 Nov 2016).
run_test: true
