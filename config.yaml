# All experiment settings live here (course rule: externalised configuration).
# Change values here, not inside the code.

data:
  path: data/weatherHistory.csv
  sha256: 22c028ceb97c6ad405831dfda61f0235532d9ab873229ff57ce4240853ef0a1f
  source: https://www.kaggle.com/datasets/arnab132/weather-dataset (version 1, downloaded 2026-10-22)
  timezone: Europe/Budapest
  window_days: 3            # model sees the last 3 days and predicts the next day's mean temperature
  # Chronological split by the date being predicted (no shuffling across time).
  train_end: "2013-12-31"   # train: 2006-2013
  val_end: "2015-12-31"     # validation: 2014-2015, test: 2016

seeds: [123, 2137, 15190]   # every configuration is trained with these 3 seeds

# Starting point = the Class 2 tabular baseline: Dense(64) -> Dense(32) -> Dense(1), Adam, MSE, batch 32.
baseline:
  input: daily              # daily | hourly | both
  daily_arch: flatten       # how the 3 daily rows are read: flatten | lstm | gru
  hourly_arch: gru          # how the 72 hourly rows are read: lstm | gru | conv1d
  units: 32                 # units of the recurrent / conv layer
  bidirectional: false
  dense: [64, 32]           # dense layers after the input branches
  dropout: 0.0
  rnn_dropout: 0.0
  l2: 0.0
  target: absolute          # absolute | delta (= tomorrow's mean minus today's mean)
  text: false               # add the 3 'Daily Summary' sentences as multi-hot words (Class 2 NLP)
  calendar: true            # day-of-year (sin, cos) of the predicted day
  loss: mse                 # mse | huber
  lr: 0.001
  batch_size: 32
  epochs: 300
  patience: 15              # early stopping on validation loss
  reduce_lr: false

# Greedy search: one change at a time (Class 2: "one parameter change per one test").
# Each stage tries its variants on top of the current best configuration; a variant is kept
# only if its mean validation MAE over the 3 seeds is lower than the current best.
search:
  - name: target
    variants:
      - {target: delta}
  - name: input
    variants:
      - {input: hourly, hourly_arch: gru}
      - {input: hourly, hourly_arch: lstm}
      - {input: hourly, hourly_arch: conv1d}
      - {input: both, hourly_arch: gru}
      - {input: daily, daily_arch: gru}
  - name: size
    variants:
      - {units: 16}
      - {units: 64}
      - {dense: []}
      - {dense: [32]}
      - {bidirectional: true}
  - name: regularisation
    variants:
      - {dropout: 0.2}
      - {dropout: 0.4}
      - {rnn_dropout: 0.2}
      - {l2: 0.0001}
  - name: optimisation
    variants:
      - {lr: 0.0003}
      - {lr: 0.003}
      - {batch_size: 16}
      - {batch_size: 64}
      - {reduce_lr: true}
  - name: loss
    variants:
      - {loss: huber}
  - name: extra_inputs
    variants:
      - {text: true}
      - {calendar: false}
  # Second pass, added after the first full run: in the first pass the input stage ran BEFORE
  # dropout/Huber/ReduceLROnPlateau were added, and the hourly input lost there. Re-testing the
  # input and target with the tuned settings (validation + K-fold only) showed it now helps.
  - name: second_pass_input
    variants:
      - {input: hourly, hourly_arch: gru}
      - {input: hourly, hourly_arch: lstm}
      - {input: both, daily_arch: gru, hourly_arch: gru}
  - name: second_pass_target
    variants:
      - {target: absolute}

# Feature ablation on the final (K-fold winner) configuration (for the presentation): drop one group at a time.
ablation: [temperature, moisture, visibility, pressure, wind, sky]

# Robustness check of the top configurations: blocked K-fold over years (regression.ipynb uses
# K-fold for small data; blocks of whole years instead of random rows avoid temporal leakage).
cv:
  top_k: 3
  folds: [[2006, 2007], [2008, 2009], [2010, 2011], [2012, 2013], [2014, 2015]]

# Final evaluation on the 2016 test set, done once after the configuration is chosen.
run_test: true

# ---------------------------------------------------------------------------------------------
# Beyond the course templates (§7b): ideas tailored to weather data, each added on top of the
# K-fold winner above and evaluated directly with blocked K-fold (5 folds x 3 seeds).
tailored:
  - name: "multi-task: predict mean + min + max"
    why: "min/max are driven by the same physics; extra supervision helps with only ~3,600 training days"
    change: {aux: minmax}
  - name: "predict the 24 hourly temperatures"
    why: "a richer target - the model must get the whole daily curve right; the mean is their average"
    change: {aux: hourly24}
  - name: "Conv1D -> GRU on the hourly input"
    why: "convolution summarises 3-hour blocks so the GRU reads 24 steps instead of 72"
    change: {hourly_arch: conv_gru}
  - name: "attention over the 72 hours"
    why: "lets the model weight the most informative hours (e.g. the latest ones) instead of only the last GRU state"
    change: {attention: true}
  - name: "wider network + stronger dropout"
    why: "more capacity, with more dropout to keep overfitting in check"
    change: {units: 64, dropout: 0.5}

# Classic machine-learning benchmarks on the same inputs, target and folds (is deep learning needed?).
classic:
  hgb: {max_iter: 1000, learning_rate: 0.05, max_leaf_nodes: 31, l2_regularization: 1.0}
  ridge_alphas: [1.0, 10.0, 100.0, 1000.0, 3000.0, 10000.0, 30000.0]

# Architecture justification (§7c): remove / replace one component of the final model at a time.
justification:
  - {name: "without the hourly branch", change: {input: daily}}
  - {name: "without the daily branch", change: {input: hourly}}
  - {name: "predict the temperature instead of the change", change: {target: absolute}}
  - {name: "daily rows flattened instead of GRU", change: {daily_arch: flatten}}
  - {name: "without dropout", change: {dropout: 0.0}}
  - {name: "MSE instead of Huber loss", change: {loss: mse}}
  - {name: "without the calendar input", change: {calendar: false}}
  - {name: "without ReduceLROnPlateau", change: {reduce_lr: false}}
  - {name: "one output instead of 24 hourly outputs", change: {aux: none}}
  - {name: "without attention", change: {attention: false}}
